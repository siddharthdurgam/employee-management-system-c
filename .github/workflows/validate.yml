name: Validate C Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 \
            employee_management_system.c -o employee_management_system

      - name: Verify executable
        run: test -x employee_management_system
